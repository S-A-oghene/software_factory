name: Release Evidence

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Generate verification evidence
        run: |
          python3 -m compileall -q factory tests scripts
          python3 -m unittest discover -s tests -v
          python3 -m factory self-test
          python3 scripts/verify_factory.py
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: software-factory-v0.1.0-evidence
          path: |
            .software-factory-gui.log
            .factory/**
            generated/**
          if-no-files-found: warn
