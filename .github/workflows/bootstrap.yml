name: Bootstrap Software Factory

on:
  workflow_dispatch:

# The built-in GITHUB_TOKEN cannot create/update workflow files in this
# first bootstrap commit. The one-time BOOTSTRAP_TOKEN secret is therefore
# used for the checkout/push. See docs/GITHUB-BOOTSTRAP-PERMISSION-FIX.md.
permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Verify one-time bootstrap token is configured
        shell: bash
        env:
          BOOTSTRAP_TOKEN: ${{ secrets.BOOTSTRAP_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${BOOTSTRAP_TOKEN}" ]; then
            echo "::error::Missing repository secret BOOTSTRAP_TOKEN. Create a fine-grained GitHub PAT limited to this repository with Contents: write and Workflows: write, then add it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Checkout bootstrap files
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.BOOTSTRAP_TOKEN }}
          persist-credentials: true
          fetch-depth: 0

      - name: Verify payload checksum
        shell: bash
        run: |
          set -euo pipefail
          test -f software_factory_payload.zip
          test -f PAYLOAD-SHA256.txt
          sha256sum -c PAYLOAD-SHA256.txt

      - name: Inspect payload before extraction
        shell: bash
        run: |
          set -euo pipefail
          unzip -tq software_factory_payload.zip
          unzip -l software_factory_payload.zip | tail -n 3

      - name: Extract payload
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          unzip -q software_factory_payload.zip -d "$work"
          rsync -a "$work/" ./ --exclude '.git/' --exclude 'software_factory_payload.zip' --exclude 'PAYLOAD-SHA256.txt'
          rm -rf "$work"

      - name: Verify Software_Factory
        shell: bash
        run: |
          set -euo pipefail
          python3 -m compileall -q factory tests scripts
          python3 -m unittest discover -s tests -v
          python3 -m factory.cli self-test
          python3 scripts/verify_factory.py

      - name: Remove bootstrap-only files
        shell: bash
        run: |
          set -euo pipefail
          rm -f software_factory_payload.zip PAYLOAD-SHA256.txt
          rm -f .github/workflows/bootstrap.yml

      - name: Commit Software_Factory
        shell: bash
        env:
          BOOTSTRAP_TOKEN: ${{ secrets.BOOTSTRAP_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Bootstrap Software_Factory v0.1.0" || echo "Nothing new to commit"
          # checkout@v5 configured the remote with BOOTSTRAP_TOKEN, which has
          # permission to create/update workflow files during this first push.
          git push origin HEAD:main
